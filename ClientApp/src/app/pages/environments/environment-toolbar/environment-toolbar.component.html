<div class="d-flex justify-content-start bg-light toolbar">
  <div class="d-flex" role="group" aria-label="Containers group">
    <button type="button" class="btn btn-light" [disabled]="false" [routerLink]="'/environment'"><i class="bi-plus-lg me-1"></i>Create</button>
    <button type="button" class="btn btn-light" [disabled]="!isOneChecked()" [routerLink]= "['/environment', getFirstSelected()?.id]"><i class="bi-pencil me-1"></i>Edit</button>
    <button type="button" class="btn btn-light" [disabled]="!isAnyChecked()" (click)="delete()" ><i class="bi-trash2 me-1"></i>Remove</button>
  </div>
</div>
