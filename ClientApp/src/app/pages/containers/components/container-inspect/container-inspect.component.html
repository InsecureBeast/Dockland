@if (!inspect) {
  <app-table-loader [type]="'block'" class="mt-3"
                    [fluidHeight] 
                    [fluidHeightEnabled]="true" 
                    [fluidHeightBottomPadding]="4">
  </app-table-loader>
} @else { 
  <ngx-monaco-editor class="form-control mt-3"
                     #editorContainer
                     [options]="editorOptions" 
                     [(ngModel)]="inspect"
                     [fluidHeight] 
                     [fluidHeightEnabled]="true" 
                     [fluidHeightBottomPadding]="4">
  </ngx-monaco-editor>
}
